server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ── Static assets — aggressive caching ───────────────────────────────────
    location ~* \.(?:js|css|png|jpg|jpeg|gif|svg|ico|woff2?|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # ── Backend API proxy ─────────────────────────────────────────────────────
    # Forwards /api/* and /health to the FastAPI backend container.
    # SSE (Server-Sent Events) requires special buffering settings.
    location /api/ {
        proxy_pass         http://backend:8000;
        proxy_http_version 1.1;
        proxy_set_header   Host              $host;
        proxy_set_header   X-Real-IP         $remote_addr;
        proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header   X-Forwarded-Proto $scheme;

        # SSE / streaming — disable buffering so events reach the client immediately
        proxy_buffering        off;
        proxy_cache            off;
        proxy_read_timeout     3600s;  # 1 hour — long-running pipeline SSE stream
        proxy_connect_timeout  10s;
        proxy_send_timeout     3600s;
        chunked_transfer_encoding on;
    }

    location /health {
        proxy_pass         http://backend:8000/health;
        proxy_http_version 1.1;
        proxy_set_header   Host $host;
    }

    # ── SPA fallback — React Router / client-side routing ────────────────────
    location / {
        try_files $uri $uri/ /index.html;
    }

    # ── Gzip compression ──────────────────────────────────────────────────────
    gzip            on;
    gzip_vary       on;
    gzip_min_length 1024;
    gzip_proxied    expired no-cache no-store private auth;
    gzip_types      text/plain text/css text/xml text/javascript
                    application/javascript application/x-javascript
                    application/json application/xml+rss;
}
